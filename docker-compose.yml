services:
  postgres:
    image: postgres:16-alpine
    container_name: kumite-arena-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kumite_arena
    ports:
      - "5432:5432"
    volumes:
      - kumite_pg_data:/var/lib/postgresql/data

volumes:
  kumite_pg_data:
